[project]
name = "thunderbird-tray"
version = "0.1.0"
description = "System tray icon for Thunderbird on Linux: hide to tray, unread count and quick actions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kemal Aslıyüksek", email = "kemal@kemalasliyuksek.com" }]
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.6"]
keywords = ["thunderbird", "tray", "system-tray", "linux", "kde", "wayland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
]

[project.urls]
Homepage = "https://github.com/kemalasliyuksek/thunderbird-tray"
Issues = "https://github.com/kemalasliyuksek/thunderbird-tray/issues"

[project.scripts]
thunderbird-tray = "thunderbird_tray.cli:main"
thunderbird-tray-host = "thunderbird_tray.app:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Turkish text in tests and labels uses the dotless i.
allowed-confusables = ["ı"]

[tool.pytest.ini_options]
testpaths = ["tests"]
